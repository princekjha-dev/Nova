name: CI Test Suite

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-rust-workspace:
    name: Rust Workspace Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libdbus-1-dev

      - name: Install Stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-std, cargo

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check Workspace
        run: cargo check --workspace

      - name: Run All Tests
        run: cargo test --workspace --verbose

  test-linux-ui:
    name: Linux Desktop Web Client Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Web Client
        working-directory: apps/linux
        run: |
          npm install
          npm run build
