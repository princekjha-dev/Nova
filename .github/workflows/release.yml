name: Release Nova

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android APK
        working-directory: apps/android
        run: |
          gradle assembleDebug --stacktrace
          mkdir -p ../../release-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk ../../release-artifacts/nova-android.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nova-android-apk
          path: release-artifacts/nova-android.apk

  build-linux:
    name: Build Linux Workstation Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libdbus-1-dev

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-std, cargo

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Compile Nova Daemon (Release)
        run: |
          cargo build --release -p nova-daemon
          mkdir -p release-artifacts
          cp target/release/nova-daemon release-artifacts/nova-daemon-linux-x86_64

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Linux Web UI Client
        working-directory: apps/linux
        run: |
          npm install
          npm run build
          cd dist && tar -czf ../../../release-artifacts/nova-desktop-web-ui.tar.gz .

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nova-linux-binaries
          path: |
            release-artifacts/nova-daemon-linux-x86_64
            release-artifacts/nova-desktop-web-ui.tar.gz

  publish-release:
    name: Publish GitHub Release with APK & Linux Binaries
    needs: [build-android, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: nova-android-apk
          path: release-assets

      - name: Download Linux Binaries
        uses: actions/download-artifact@v4
        with:
          name: nova-linux-binaries
          path: release-assets

      - name: Generate SHA-256 Checksums
        working-directory: release-assets
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: Nova Release ${{ github.event.inputs.tag_name || github.ref_name }}
          body: |
            ## 🚀 Nova Cross-Device Ecosystem Release
            
            Welcome to the official release of **Nova** — cross-device Linux ↔ Android continuity ecosystem.
            
            ### 📱 Android Download
            - **[nova-android.apk](https://github.com/${{ github.repository }}/releases/download/${{ github.event.inputs.tag_name || github.ref_name }}/nova-android.apk)**: Install directly on your Android phone (Android 8.0+ / API 26+).
            
            ### 💻 Linux Downloads
            - **nova-daemon-linux-x86_64**: Standalone core daemon with Noise Protocol, mDNS discovery, and CRDT sync engine.
            - **nova-desktop-web-ui.tar.gz**: Bundled glassmorphic desktop interface.
            
            ### 🔐 Checksums & Verification
            Verify the SHA-256 integrity of your downloaded assets against `SHA256SUMS.txt`.
          files: |
            release-assets/*
          draft: false
          prerelease: false
