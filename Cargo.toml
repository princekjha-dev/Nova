[workspace]
members = [
    "crates/nova-core",
    "crates/nova-crypto",
    "crates/nova-discovery",
    "crates/nova-transport",
    "crates/nova-sync",
    "crates/nova-plugins/clipboard",
    "crates/nova-plugins/notes",
    "crates/nova-plugins/files",
    "crates/nova-plugins/handoff",
    "crates/nova-plugins/ai",
    "crates/nova-plugins/mirror",
    "crates/nova-plugins/remote",
    "crates/nova-daemon",
    "services/signaling",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Nova Team"]
license = "Apache-2.0"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1.3"
uuid = { version = "1.10", features = ["v4", "v5", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
hex = "0.4"
zeroize = { version = "1.8", features = ["derive"] }
ed25519-dalek = { version = "2.1", features = ["serde"] }
x25519-dalek = { version = "2.0" }
snow = "0.9"
sha3 = "0.10"
sha2 = "0.10"
mdns-sd = "0.13"
qrcode = "0.14"
bytes = "1.7"
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors"] }
gethostname = "0.5"
futures = "0.3"
futures-util = "0.3"
tokio-tungstenite = "0.24"
rusqlite = { version = "0.32", features = ["bundled", "uuid", "chrono"] }
